<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Efe & Elif — QR Kart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0f24;
      font-family: Georgia, serif;
      padding: 2rem;
    }
    .card {
      background: linear-gradient(145deg, #1a0f24, #2d1a35);
      border: 1px solid rgba(255,107,157,0.3);
      border-radius: 24px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 380px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    }
    .names {
      font-size: 2rem;
      background: linear-gradient(135deg, #fff, #ff8fb3, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-style: italic;
      margin-bottom: 2rem;
      font-size: 1rem;
    }
    .qr-wrap {
      background: white;
      border-radius: 16px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 1.5rem;
    }
    .qr-wrap img {
      width: 220px;
      height: 220px;
      display: block;
    }
    .hint {
      color: rgba(255,255,255,0.4);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .heart { font-size: 1.5rem; margin-top: 1rem; }
    @media print {
      body { background: white; }
      .card { box-shadow: none; border: 1px solid #eee; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="names">Efe & Elif</div>
    <p class="subtitle">Bizim Hikayemiz</p>
    <div class="qr-wrap">
      <img src="assets/qr-code.png" alt="QR Kod">
    </div>
    <p class="hint">Tara ve keşfet</p>
    <div class="heart">💕</div>
  </div>
</body>
</html>
